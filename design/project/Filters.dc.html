<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Cari Tadika, Tapis</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=Spectral:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.ct{--bg:#E2DDCC;--rule:rgba(27,42,38,.07);--sf:#FBFAF4;--sf2:#EEE8D6;--ink:#1B2A26;--mu:#47524B;--ln:#9C8F68;--gr:#1F6E43;--grbg:#DCE8DB;--oc:#6E5216;--ocbg:#EFE1BC;--ib:#1B2A26;--ibt:#FBFAF4;--scrim:#8C8779;font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--scrim)}
.ct.dk{--bg:#141E1A;--rule:rgba(231,236,230,.05);--sf:#1D2B26;--sf2:#263630;--ink:#E7ECE6;--mu:#A9B5AB;--ln:#728578;--gr:#5FC98F;--grbg:#1F3A2E;--oc:#E4C36B;--ocbg:#3B3218;--ib:#E7ECE6;--ibt:#141E1A;--scrim:#070B09}
.ct *{box-sizing:border-box}
.ct h2,.ct p{margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.sheet{position:absolute;left:0;right:0;bottom:0;top:52px;border-radius:22px 22px 0 0;background-color:var(--bg);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--rule) 27px,var(--rule) 28px);display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:8px auto 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:4px 12px 12px 4px;font:600 15px/1 'IBM Plex Sans',system-ui,sans-serif;text-decoration:none;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn.ink{background:var(--ib);color:var(--ibt);border-color:var(--ib)}
.btn:focus-visible,.opt:focus-visible,.row:focus-visible{outline:3px solid var(--oc);outline-offset:2px}
.lab{font:600 12px/1 'IBM Plex Sans',system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--mu)}
.grp{display:grid;gap:6px}
.opt{min-height:44px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:4px 12px 12px 4px;font:500 14px/1.1 'IBM Plex Sans',system-ui,sans-serif;cursor:pointer;padding:0 4px}
.opt.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:14px}
.opt.on{background:var(--ib);color:var(--ibt);border-color:var(--ib);font-weight:600}
.tg{border:1.5px solid var(--ln);background:var(--sf);border-radius:4px 14px 14px 4px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:6px 14px;background:transparent;border:0;border-bottom:1px dotted var(--ln);color:var(--ink);text-align:left;cursor:pointer;font:500 15px/1.3 'IBM Plex Sans',system-ui,sans-serif}
.row:last-child{border-bottom:0}
.row small{display:block;font-size:13px;line-height:1.35;color:var(--mu);font-weight:400;margin-top:2px}
.sw{flex:none;position:relative;width:48px;height:28px;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf2)}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--mu)}
.sw.on{background:var(--gr);border-color:var(--gr)}
.sw.on::after{left:22px;background:var(--sf)}
.swt{flex:none;font:600 12px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.06em;color:var(--mu);width:24px;text-align:right}
.tag{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:3px;background:var(--ocbg);color:var(--oc);font:600 11.5px/1 'IBM Plex Sans',system-ui,sans-serif;letter-spacing:.06em;vertical-align:middle}
.btn,.opt,.row{transition:background-color .15s ease,color .15s ease,border-color .15s ease}
.sw,.sw::after{transition:left .18s ease,background-color .15s ease}
@media (prefers-reduced-motion: reduce) { .ct *, .ct *::before, .ct *::after { transition: none !important; animation: none !important; } }
.foot{padding:12px 16px 34px;background:var(--sf);border-top:1.5px solid var(--ln);display:flex;gap:8px}
</style>
</helmet>
<div class="ct {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden;">
<div class="sheet" role="dialog" aria-label="{{t.title}}">
<div class="grab"></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 0 16px;">
<h2 style="font: 700 24px/1 'Spectral', Georgia, serif;">{{t.title}}</h2>
<a class="btn" href="Home.dc.html" aria-label="{{t.close}}" style="border-color: transparent; min-width: 44px; padding: 0;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path></svg>
</a>
</div>

<div style="flex: 1; overflow: hidden; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 18px;">

<div style="display: flex; flex-direction: column; gap: 8px;">
<div class="lab" id="l-sort">{{t.sort}}</div>
<div class="grp" role="radiogroup" aria-labelledby="l-sort" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
<sc-for list="{{sortOpts}}" as="o" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{o.aria}}" class="opt {{o.cls}}" onClick="{{o.pick}}">{{o.t}}</button></sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<div class="lab" id="l-dist">{{t.dist}}</div>
<div class="grp" role="radiogroup" aria-labelledby="l-dist" style="grid-template-columns: repeat(5, minmax(0, 1fr));">
<sc-for list="{{distOpts}}" as="o" hint-placeholder-count="5"><button type="button" role="radio" aria-checked="{{o.aria}}" class="opt {{o.cls}}" onClick="{{o.pick}}">{{o.t}}</button></sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<div class="lab" id="l-bud">{{t.bud}}</div>
<div class="grp" role="radiogroup" aria-labelledby="l-bud" style="grid-template-columns: repeat(5, minmax(0, 1fr));">
<sc-for list="{{budOpts}}" as="o" hint-placeholder-count="5"><button type="button" role="radio" aria-checked="{{o.aria}}" class="opt {{o.cls}}" onClick="{{o.pick}}">{{o.t}}</button></sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<div class="lab">{{t.only}}</div>
<div class="tg">
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="4">
<button type="button" role="switch" aria-checked="{{t.aria}}" class="row" onClick="{{t.pick}}">
<span>{{t.t}}<sc-if value="{{t.hasTag}}" hint-placeholder-val="{{ false }}"><span class="tag">{{t.tag}}</span></sc-if><small>{{t.sub}}</small></span>
<span style="display: flex; align-items: center; gap: 8px;"><span class="swt">{{t.state}}</span><span class="sw {{t.cls}}"></span></span>
</button>
</sc-for>
</div>
</div>

</div>

<div class="foot">
<button type="button" class="btn" onClick="{{reset}}">{{t.reset}}</button>
<a class="btn ink" href="Home.dc.html" style="flex: 1;">{{t.show}}</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Rupa"},"lang":{"editor":"enum","options":["ms","en"],"default":"ms","section":"Bahasa"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { sort: 'skor', dist: '10', bud: 'all', kpm: false, hide: true, trial: false, trans: false, lang: null };
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const en = (this.props.lang ?? 'ms') === 'en';
    const T = (m, e) => (en ? e : m);
    const s = this.state;
    const mk = (key, list) => list.map((o) => ({
      t: o.t,
      aria: s[key] === o.v ? 'true' : 'false',
      cls: (s[key] === o.v ? 'on' : '') + (o.mono ? ' mono' : ''),
      pick: () => this.setState({ [key]: o.v })
    }));
    const tg = (key, t, sub, tag) => ({
      t: t,
      sub: sub || '',
      tag: tag || '',
      hasTag: !!tag,
      aria: s[key] ? 'true' : 'false',
      cls: s[key] ? 'on' : '',
      state: s[key] ? 'ON' : 'OFF',
      pick: () => this.setState({ [key]: !s[key] })
    });
    return {
      themeClass: dark ? 'dk' : '',
      t: { title: T('Tapis', 'Filters'), close: T('Tutup', 'Close'), sort: T('Susun ikut', 'Sort by'), dist: T('Jarak maksimum', 'Max distance'), bud: T('Bajet maksimum setahun (RM)', 'Max yearly budget (RM)'), only: T('Tunjuk hanya', 'Show only'), reset: T('Tetap semula', 'Reset'), show: T('Papar 39 tadika', 'Show 39 kindergartens') },
      sortOpts: mk('sort', [{ t: T('Skor tertinggi', 'Highest score'), v: 'skor' }, { t: T('Terdekat', 'Nearest'), v: 'dekat' }, { t: T('Kos terendah', 'Lowest cost'), v: 'kos' }]),
      distOpts: mk('dist', [{ t: '3 km', v: '3', mono: 1 }, { t: '5 km', v: '5', mono: 1 }, { t: '10 km', v: '10', mono: 1 }, { t: '25 km', v: '25', mono: 1 }, { t: T('Semua', 'All'), v: 'all' }]),
      budOpts: mk('bud', [{ t: '2,000', v: '2', mono: 1 }, { t: '4,000', v: '4', mono: 1 }, { t: '6,000', v: '6', mono: 1 }, { t: '10,000', v: '10', mono: 1 }, { t: T('Semua', 'All'), v: 'all' }]),
      toggles: [
        tg('kpm', T('Berdaftar dengan KPM sahaja', 'KPM-registered only')),
        tg('hide', T('Sembunyi bendera merah utama', 'Hide major red flags'), T('Tadika dengan bendera merah pada KPM atau keselamatan.', 'Kindergartens with a red flag on KPM or safety.'), T('LALAI', 'DEFAULT')),
        tg('trial', T('Ada sesi percubaan', 'Offers a trial session')),
        tg('trans', T('Perlu pengangkutan', 'Needs transport'), T('Kos pengangkutan dimasukkan dalam jumlah setahun.', 'Transport cost is added to the yearly total.'))
      ],
      reset: () => this.setState({ sort: 'skor', dist: 'all', bud: 'all', kpm: false, hide: true, trial: false, trans: false })
    };
  }
}
</script>
</body>
</html>
